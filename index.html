<style>

    --card: #201634;
    --ink: #F3EBFF;
    --ink-2: #B4A3D4;
    --ink-3: #8878A8;
    --pink: #FF7AC4;
    --pink-soft: #38152C;
    --violet: #B79BFF;
    --violet-soft: #271B45;
    --aqua: #45D6C4;
    --aqua-soft: #12332F;
    --gold: #FFCF57;
    --gold-soft: #322614;

    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 20px rgba(0, 0, 0, .3);

    color: var(--ink);

  header { padding: 16px 0 10px; display: flex; flex-direction: column; gap: 7px; }

    font-weight: 600;

    border: 0;
    color: var(--violet);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    padding: 7px 6px;
  }

  .strip {
    border: 1.5px solid var(--gold);
    background: var(--gold-soft);
    border-radius: 16px;

    margin-top: 14px;

    flex-direction: column;
    gap: 8px;

  .strip h2 { margin: 0; font-family: Fredoka, Assistant, sans-serif; font-weight: 600; font-size: 16px; color: var(--gold); display: flex; justify-content: space-between; align-items: center; gap: 10px; }

  .day { margin-top: 20px; }
  .day-head {
    font-family: Fredoka, Assistant, sans-serif;
    font-weight: 600;
    font-size: 19px;
    margin: 0 0 9px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .day-head.today { color: var(--pink); }
  .day-head::after { content: ""; flex: 1; height: 2px; border-radius: 2px; background: var(--line); }

  .ev {
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 11px;
    display: flex;
    flex-direction: column;
  }
  .ev.going { border-color: var(--pink); }

  .thumb {
    height: 128px;
    background: linear-gradient(135deg, var(--violet), var(--pink));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    position: relative;
    flex: none;
  }
  .thumb.s0 { background: linear-gradient(135deg, var(--pink), #FF9AC4); }
  .thumb.s2 { background: linear-gradient(135deg, var(--aqua), var(--violet)); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scrim {
    position: absolute;
    inset: auto 0 0 0;
    height: 62px;
    background: linear-gradient(to top, rgba(0, 0, 0, .45), rgba(0, 0, 0, 0));
    pointer-events: none;
  }
  .venue-pill {
    position: absolute;
    inset-block-end: 9px;
    inset-inline-start: 9px;
    max-width: calc(100% - 18px);
    background: var(--card);
    color: var(--ink);
    font-family: Fredoka, Assistant, sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    padding: 4px 12px;

    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .venue-pill .dot.s0 { background: var(--pink); }
  .venue-pill .dot.s1 { background: var(--violet); }
  .venue-pill .dot.s2 { background: var(--aqua); }

  .sources { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
  .sources .lead { font-family: Fredoka, Assistant, sans-serif; font-size: 14px; color: var(--ink-3); }
  .srcscroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .srcscroll::-webkit-scrollbar { display: none; }
  .srcscroll button {
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--ink-2);
    border-radius: 999px;
    min-height: 36px;
    padding: 6px 13px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .srcscroll button .num {
    background: var(--violet-soft);
    color: var(--violet);
    border-radius: 999px;
    padding: 0 7px;
    font-size: 12.5px;
    font-weight: 700;
  }
  .srcscroll button.on { background: var(--violet); border-color: var(--violet); color: #fff; }
  .srcscroll button.on .num { background: rgba(255, 255, 255, .25); color: #fff; }
  .srcscroll button:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  .strip.mini {
    flex-direction: row;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    overflow: hidden;
  }
  .strip.mini h2 { flex: none; font-size: 14px; }
  .strip.mini .one {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .strip.mini .linkish { flex: none; }
  .day { margin-top: 14px; }

  .watching { font-size: 13px; color: var(--ink-3); }
  .timescroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
  .timescroll::-webkit-scrollbar { display: none; }
  .timescroll button {
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--ink-2);
    border-radius: 999px;
    min-height: 38px;
    padding: 6px 15px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .timescroll button.on { background: var(--pink); border-color: var(--pink); color: #fff; }
  .timescroll button.on .count { opacity: .8; }
  .timescroll button:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

  .fav {
    position: absolute;
    inset-block-start: 8px;
    inset-inline-end: 8px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 0;
    background: rgba(255, 255, 255, .92);
    color: var(--ink-3);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .fav.on { color: var(--pink); }
  .fav:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

  .fab {
    position: fixed;
    inset-block-end: 16px;
    inset-inline-start: 16px;
    z-index: 30;
    background: var(--pink);
    color: #fff;
    border: 0;
    border-radius: 999px;
    padding: 13px 20px;
    font-family: Fredoka, Assistant, sans-serif;
    font-size: 15.5px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(200, 28, 134, .35);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .fab:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }

  .empty-cta { margin-top: 11px; }
  .stale {

    padding: 9px 13px;
    font-size: 14px;
    font-weight: 600;
    margin-top: 12px;
  }
  .leadrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .barcount {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-3);
    background: var(--line-soft);
    border-radius: 999px;
    padding: 4px 10px;
    flex: none;
  }

  .body { padding: 12px 14px 13px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  .when-line {
    font-family: Fredoka, Assistant, sans-serif;
    font-size: 15px;
    color: var(--pink);
    font-variant-numeric: tabular-nums;
  }
  .ev h3 { margin: 0; font-family: Fredoka, Assistant, sans-serif; font-weight: 500; font-size: 19px; line-height: 1.28; text-wrap: balance; }
  .badge { font-size: 12.5px; padding: 1px 9px; border-radius: 999px; background: var(--pink); color: #fff; margin-inline-start: 6px; white-space: nowrap; }
  .place { color: var(--ink-3); font-size: 14.5px; }
  .place .venue-name { color: var(--ink); font-weight: 700; }
  .desc { color: var(--ink-2); font-size: 14.5px; }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1.5px solid var(--line); color: var(--ink-2); }
  .chip.free { color: var(--aqua); border-color: var(--aqua); }
  .chip.gone { color: var(--gold); border-color: var(--gold); }

  .note { font-size: 13.5px; color: var(--ink-3); }

  .foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding-top: 10px;
    margin-top: 2px;
    border-top: 1.5px solid var(--line-soft);
  }
  .slots { display: flex; gap: 5px; }
  .slot {
    font-family: Fredoka, Assistant, sans-serif;
    font-size: 13.5px;
    min-width: 58px;
    height: 42px;
    padding: 0 9px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid transparent;
    background: var(--violet-soft);
    color: var(--violet);
    font-weight: 600;
  }
  .slot.mine { border-color: currentColor; }
  .slot.empty { background: transparent; border: 1.5px dashed var(--line); color: var(--ink-3); cursor: pointer; font-size: 15px; }
  .slot.empty:hover { border-color: var(--pink); color: var(--pink); }
  .slot.empty:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  .slot.more { background: transparent; border: 1.5px dotted var(--line); color: var(--ink-3); min-width: 44px; }
  .slot-msg { font-size: 13.5px; color: var(--ink-3); flex: 1; min-width: 110px; }
  .slot-msg.ready { color: var(--pink); font-weight: 700; }

  a.link, button.undo {
    color: var(--violet);
    background: none;
    border: 0;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    padding: 8px 4px;
    display: inline-flex;
    align-items: center;
  }
  a.link:hover, button.undo:hover { text-decoration: underline; }
  a.link:focus-visible, button.undo:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

  .namebox {
    background: var(--card);
    border: 1.5px solid var(--pink);
    border-radius: 16px;
    padding: 13px;
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .namebox p { margin: 0; flex-basis: 100%; font-size: 15px; color: var(--ink-2); }
  input[type="text"] {
    font-family: inherit;
    font-size: 16px;
    padding: 9px 13px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    flex: 1;
    min-width: 150px;
  }
  input[type="text"]:focus-visible { outline: 2px solid var(--violet); outline-offset: 1px; }
  .btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    border-radius: 999px;
    border: 1.5px solid var(--pink);
    background: var(--pink);
    color: #fff;
    padding: 9px 18px;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--violet); border-color: var(--line); }

  .share { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

  .empty-state { color: var(--ink-3); font-size: 15px; border: 1.5px dashed var(--line); border-radius: 16px; padding: 18px; text-align: center; margin-top: 16px; }

  footer { color: var(--ink-3); font-size: 13.5px; border-top: 1.5px solid var(--line); padding-top: 14px; margin-top: 22px; display: flex; flex-direction: column; gap: 4px; }

  .toast {
    position: fixed;
    inset-block-end: 18px;
    inset-inline-start: 50%;
    transform: translateX(50%);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    z-index: 40;
  }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

  @media (min-width: 560px) {
    .ev { flex-direction: row; }
    .thumb { width: 168px; height: auto; min-height: 150px; font-size: 34px; }
    .body { flex: 1; }
  }

  var NEXT_SCAN = 'מוצאי שבת';
  var DOWNAMES = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function dayDiff(iso) {
    if (!iso) return null;
    var a = new Date(iso + 'T00:00:00'), b = new Date(todayISO() + 'T00:00:00');
    return Math.round((a - b) / 86400000);
  }
  function dayLabelOf(iso) {
    var d = dayDiff(iso);
    if (d === null) return 'פתוח לאורך זמן';
    var dt = new Date(iso + 'T00:00:00');
    var base = DOWNAMES[dt.getDay()] + ' ' + dt.getDate() + '.' + (dt.getMonth() + 1);
    if (d === 0) return 'היום · ' + base;
    if (d === 1) return 'מחר · ' + base;
    if (d === 2) return 'מחרתיים · ' + base;
    return base;
  }
  function scanAgeDays() {
    var a = new Date(SCANNED_ISO + 'T00:00:00'), b = new Date(todayISO() + 'T00:00:00');
    return Math.round((b - a) / 86400000);
  }
  function scannedLabel() {
    var d = new Date(SCANNED_ISO + 'T00:00:00');
    return d.getDate() + '.' + (d.getMonth() + 1);
  }
  function nextDayWithEvents() {
    var save = view.bucket;
    view.bucket = 'הכל';
    var list = EVENTS.filter(inFilters).filter(function (e) { return e.iso; })
      .sort(function (a, b) { return a.iso.localeCompare(b.iso); });
    view.bucket = save;
    return list.length ? list[0] : null;
  }
  function isPast(e) {
    var d = dayDiff(e.iso);
    return d !== null && d < 0;
  }
  var QUORUM = 3;
  var NEAR_KM = 2;
  var BUCKETS = [
    { key: 'היום', label: 'היום' },
    { key: 'מחר', label: 'מחר' },
    { key: 'מחרתיים', label: 'מחרתיים' },
    { key: 'סופש', label: 'סופ״ש' },
    { key: 'השבוע', label: 'השבוע' },
    { key: 'הכל', label: 'הכל' }
  ];
  var SHELF_TAG = ["קרוב אלינו", "שווה לנסוע", "יעד ליום שלם"];
  var EMOJI = {
    "תיאטרון": "🎭", "מחול": "💃", "קולנוע": "🎬", "תערוכה": "🖼️", "מוזיקה": "🎵",
    "הקראה": "📖", "סדנה": "✂️", "הפנינג": "🎉", "טבע": "🌿"
  };

  var state = { rsvp: {} };
  var CFG = (window.CULTURE_CONFIG || {});
  var API = CFG.supabaseUrl ? CFG.supabaseUrl.replace(/\/+$/, '') + '/rest/v1/rsvp' : '';
  var HEAD = { apikey: CFG.supabaseAnonKey || '', Authorization: 'Bearer ' + (CFG.supabaseAnonKey || ''), 'Content-Type': 'application/json' };

  var view = { bucket: 'השבוע', near: false, types: [], source: '', fav: false, stripOpen: false, mode: 'date', askName: false, pendingId: "" };
  var canWrite = false, myKidsRaw = "";
  try { myKidsRaw = localStorage.getItem("bg4-kids") || ""; } catch (e) {}

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function kidList(s) {
    return String(s || "").split(/\s*,\s*|\s+ו(?=[א-ת])/).map(function (x) { return x.trim(); }).filter(Boolean);
  }
  function myKids() { return kidList(myKidsRaw); }

  var favs = [];
  try { favs = JSON.parse(localStorage.getItem('bg4-favs') || '[]'); } catch (e) { favs = []; }
  function isFav(id) { return favs.indexOf(id) > -1; }
  function toggleFav(id) {
    var i = favs.indexOf(id);
    if (i > -1) favs.splice(i, 1); else favs.push(id);
    try { localStorage.setItem('bg4-favs', JSON.stringify(favs)); } catch (e) {}
    render();
  }
  function iAmIn(id) {
    var list = state.rsvp[id] || [], mine = myKids();

  }
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 2300);
  }
  function allSources() {
    var counts = {}, order = [];
    EVENTS.forEach(function (e) {
      if (counts[e.source] === undefined) { counts[e.source] = 0; order.push(e.source); }
      counts[e.source]++;
    });
    return order.map(function (n) { return { name: n, n: counts[n] }; }).sort(function (a, b) { return b.n - a.n; });
  }
  function allTypes() {
    var seen = [];
    EVENTS.forEach(function (e) { if (seen.indexOf(e.type) < 0) seen.push(e.type); });
    return seen;
  }

  function inBucket(e) {
    if (!e.iso) return view.bucket === 'הכל';
    var d = dayDiff(e.iso);
    if (d < 0) return false;
    if (view.bucket === 'הכל') return true;
    if (view.bucket === 'היום') return d === 0;
    if (view.bucket === 'מחר') return d === 1;
    if (view.bucket === 'מחרתיים') return d === 2;
    if (view.bucket === 'סופש') {
      var wd = new Date(e.iso + 'T00:00:00').getDay();
      return (wd === 5 || wd === 6) && d <= 8;
    }
    return d <= 7;
  }
  function inFilters(e) {
    if (isPast(e)) return false;
    if (view.fav && !isFav(e.id)) return false;
    if (view.source && e.source !== view.source) return false;
    if (view.types.length && view.types.indexOf(e.type) < 0) return false;
    if (view.near && !(e.km !== null && e.km <= NEAR_KM)) return false;
    return inBucket(e);
  }
  function shown() { return EVENTS.filter(inFilters); }
  function kmText(e) {
    if (e.km === null || e.km === undefined) return "";
    return (e.approx ? "כ-" : "") + e.km + " קמ מיפו";
  }

  function slotsHtml(e) {
    var list = state.rsvp[e.id] || [], mine = myKids();
    var head = list.slice(0, QUORUM);
    var h = '<div class="slots">';
    head.forEach(function (k) {
      h += '<span class="slot' + (mine.indexOf(k) > -1 ? " mine" : "") + '">' + esc(k) + "</span>";
    });
    for (var i = head.length; i < QUORUM; i++) {
      h += '<button class="slot empty" data-id="' + esc(e.id) + '" aria-label="מסמנים שאנחנו מגיעים">+</button>';
    }
    if (list.length > QUORUM) h += '<span class="slot more">+' + (list.length - QUORUM) + "</span>";
    h += "</div>";
    var missing = QUORUM - list.length;
    var msg = list.length >= QUORUM ? "יוצאים ביחד"
      : missing === QUORUM ? "שלושה ויוצאים"
      : missing === 1 ? "עוד אחד ויוצאים" : "עוד " + missing + " ויוצאים";
    h += '<span class="slot-msg' + (list.length >= QUORUM ? " ready" : "") + '">' + msg + "</span>";
    return h;
  }

  function messageText() {
    var lines = [];
    var near = EVENTS.filter(function (e) { return e.shelf === 0 && e.iso; }).slice(0, 6);
    lines.push("חדי הקרן, מה יש בשבועות הקרובים לגילי 4 עד 6, לפי מה שקרוב אלינו:");
    lines.push("");
    near.forEach(function (e) {
      lines.push(e.date + " " + (e.time || "") + " " + e.title + ", " + e.place + (e.free ? ", חינם" : ""));
    });
    var urgent = EVENTS.filter(function (e) { return e.urgency === "לתפוס עכשיו"; });
    if (urgent.length) {
      lines.push("");
      lines.push("כדאי לתפוס לפני שייגמר: " + urgent[0].title + ", " + urgent[0].place + ", " + urgent[0].date + ".");
    }
    var ready = EVENTS.filter(function (e) { return (state.rsvp[e.id] || []).length >= QUORUM; });
    if (ready.length) {
      lines.push("");
      lines.push("כבר יוצאים:");
      ready.slice(0, 4).forEach(function (e) {
        lines.push(e.date + " " + e.title + ": " + (state.rsvp[e.id] || []).join(", "));
      });
    }
    lines.push("");
    lines.push("מסמנים שאתם באים כאן: " + location.href);
    return lines.join("\n");
  }

  function evHtml(e) {
    var going = (state.rsvp[e.id] || []).length >= QUORUM;
    var h = '<article class="ev' + (going ? " going" : "") + '">';
    h += '<div class="thumb s' + e.shelf + '">';
    if (e.img) { h += '<img src="' + e.img + '" alt="" loading="lazy">'; h += '<span class="scrim"></span>'; }
    else h += esc(EMOJI[e.type] || "✨");
    h += '<span class="venue-pill"><span class="dot s' + e.shelf + '"></span>' + esc(e.venue || e.place) + '</span>';
    h += '<button class="fav' + (isFav(e.id) ? ' on' : '') + '" data-f="' + esc(e.id) + '" aria-label="מועדף">' + (isFav(e.id) ? '♥' : '♡') + '</button>';
    h += "</div>";
    h += '<div class="body">';
    h += '<div class="when-line">' + esc(e.iso ? dayLabelOf(e.iso).replace(/^היום · |^מחר · |^מחרתיים · /, "") + (e.time ? " · " + e.time : "") : e.date) + "</div>";
    h += "<h3>" + esc(e.title) + (going ? '<span class="badge">יוצאים ביחד</span>' : "") + "</h3>";
    var bits = [];
    if (e.venue) bits.push('<b class="venue-name">' + esc(e.venue) + "</b>");
    var dup = e.venue && e.source && (e.venue.indexOf(e.source) > -1 || e.source.indexOf(e.venue) > -1);
    if (e.source && !dup) bits.push(esc(e.source));
    if (kmText(e)) bits.push(esc(kmText(e)));
    h += '<div class="place">' + bits.join(" · ") + "</div>";
    if (e.desc) h += '<div class="desc">' + esc(e.desc) + "</div>";
    h += '<div class="chips">';
    h += '<span class="chip">' + esc(SHELF_TAG[e.shelf]) + "</span>";
    h += '<span class="chip">' + esc(e.type) + "</span>";
    h += '<span class="chip">' + esc(e.age) + "</span>";
    h += '<span class="chip ' + (e.free ? "free" : "") + '">' + esc(e.price || (e.free ? "חינם" : "בתשלום")) + "</span>";
    if (e.urgency === "אזל") h += '<span class="chip gone">אזל</span>';
    h += "</div>";
    if (e.note) h += '<div class="note">' + esc(e.note) + "</div>";
    h += '<div class="foot">';

    if (iAmIn(e.id)) h += '<button class="undo" data-id="' + esc(e.id) + '">מבטלים</button>';
    if (e.reg) h += '<a class="link" href="' + esc(e.reg) + '" target="_blank" rel="noopener">להרשמה</a>';

    h += "</div></div></article>";

  }

  function listHtml() {
    var evs = shown();
    if (!evs.length) {
      var nxt = nextDayWithEvents();
      if (nxt) {
        return '<div class="empty-state"><b>אין פעילות בסינון הזה.</b><br>הכי קרוב: ' + esc(dayLabelOf(nxt.iso)) + ', ' + esc(nxt.title) +
          '<div class="empty-cta"><button class="btn" id="jump">להראות מ' + esc(dayLabelOf(nxt.iso).replace(/ · .*$/, '')) + '</button></div></div>';
      }
      return '<div class="empty-state"><b>הרשימה הנוכחית נגמרה.</b><br>הסריקה הבאה עולה ב' + esc(NEXT_SCAN) + ', ואז הלוח יתמלא מחדש.</div>';
    }
    var h = "";
    if (view.mode === "date") {
      var order = [], groups = {};
      evs.slice().sort(function (a, b) {
        return (a.iso || "9999").localeCompare(b.iso || "9999") || (a.time || "").localeCompare(b.time || "");
      }).forEach(function (e) {
        var k = dayLabelOf(e.iso);
        if (!groups[k]) { groups[k] = []; order.push(k); }
        groups[k].push(e);
      });
      order.forEach(function (k) {
        h += '<section class="day"><h2 class="day-head' + (/^היום/.test(k) ? " today" : "") + '">' + esc(k) + "</h2>";

        h += "</section>";
      });
    } else {

        var g = evs.filter(function (e) { return e.shelf === s; });

  function stripHtml() {

  function render() {
    var n = shown().length;

    h += '<div class="srcscroll">';

      h += '<button class="src' + (view.source === s.name ? " on" : "") + '" data-s="' + esc(s.name) + '">' + esc(s.name) + '<span class="num">' + s.n + "</span></button>";

    h += "</div>";

    h += "</header>";

    h += '<div class="bar">';

      h += '<button class="bucket' + (view.bucket === b.key ? ' on' : '') + '" data-b="' + esc(b.key) + '">' + esc(b.label) + (cnt ? ' <span class="count">' + cnt + '</span>' : '') + '</button>';

    h += '</div>';
    h += '<div class="row">';

    h += '</div>';
    h += '<div class="row"><div class="chipscroll">';
    allTypes().forEach(function (t) {

    h += "</div>";
    h += '</div>';
    h += "</div>";

    if (view.askName) {
      h += '<div class="namebox"><p>איך קוראים לילדים שלכם? השם יופיע בריבוע כדי שכולם יראו מי מגיע.</p>';
      h += '<input type="text" id="nm" value="' + esc(myKidsRaw) + '" placeholder="שם, ועוד שם">';

      h += '<div class="stale">הרשימה הזו מהסריקה של ' + esc(scannedLabel()) + '. סריקה חדשה עולה ב' + esc(NEXT_SCAN) + '.</div>';

    h += "<span>שעות סיפור והפנינגים רחוקים לא נכנסים ללוח בכוונה. המרחק הוא קו אווירי משוק הפשפשים.</span></footer>";
    h += '</div>';
    h += '<a class="fab" id="fab" href="https://wa.me/?text=" target="_blank" rel="noopener">שליחה לחבורה</a>';
    h += '<div class="toast" id="toast"></div>';

    document.getElementById("app").innerHTML = h;
    wire();
  }

  function wire() {
    var wa = document.getElementById("wa");
    if (wa) wa.setAttribute("href", "https://wa.me/?text=" + encodeURIComponent(messageText()));

    var copy = document.getElementById("copy");
    if (copy) copy.addEventListener("click", function () {
      var txt = messageText();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function () { toast("ההודעה הועתקה"); },
          function () { toast("ההעתקה נחסמה, אפשר לסמן ולהעתיק ידנית"); });
      } else { toast("ההעתקה לא נתמכת בדפדפן הזה"); }
    });

    var save = document.getElementById("save");
    if (save) save.addEventListener("click", function () {
      myKidsRaw = document.getElementById("nm").value.trim();
      try { localStorage.setItem("bg4-kids", myKidsRaw); } catch (e) {}
      view.askName = false;
      var pending = view.pendingId;
      view.pendingId = "";
      if (myKidsRaw && pending) { join(pending); return; }
      toast(myKidsRaw ? "נשמר: " + myKids().join(", ") : "השמות נוקו");
      render();
    });

    var edit = document.getElementById("edit");
    if (edit) edit.addEventListener("click", function () { view.askName = true; render(); });

    Array.prototype.forEach.call(document.querySelectorAll("button.bucket"), function (b) {
      b.addEventListener("click", function () { view.bucket = b.getAttribute("data-b"); render(); });
    });
    var st = document.getElementById("stripToggle");
    if (st) st.addEventListener("click", function () { view.stripOpen = !view.stripOpen; render(); });
    var jump = document.getElementById('jump');
    if (jump) jump.addEventListener('click', function () { view.bucket = 'הכל'; view.near = false; render(); });
    var onTime = document.querySelector('.timescroll button.on');
    if (onTime && onTime.parentNode) {
      var box = onTime.parentNode;
      box.scrollLeft = onTime.offsetLeft - (box.clientWidth - onTime.offsetWidth) / 2;
    }
    document.getElementById('near').addEventListener('click', function () { view.near = !view.near; render(); });
    document.getElementById('favBtn').addEventListener('click', function () { view.fav = !view.fav; render(); });
    Array.prototype.forEach.call(document.querySelectorAll('button.fav'), function (b) {
      b.addEventListener('click', function () { toggleFav(b.getAttribute('data-f')); });
    });
    var fab = document.getElementById('fab');
    if (fab) fab.setAttribute('href', 'https://wa.me/?text=' + encodeURIComponent(messageText()));
    document.getElementById("mode").addEventListener("click", function () {
      view.mode = view.mode === "date" ? "shelf" : "date";
      render();
    });
    Array.prototype.forEach.call(document.querySelectorAll("button.src"), function (b) {
      b.addEventListener("click", function () {
        var v = b.getAttribute("data-s");
        view.source = view.source === v ? "" : v;
        render();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("button.type"), function (b) {
      b.addEventListener("click", function () {
        var t = b.getAttribute("data-t"), i = view.types.indexOf(t);
        if (i > -1) view.types.splice(i, 1); else view.types.push(t);
        render();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".slot.empty"), function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-id");
        if (!myKidsRaw) {
          view.askName = true;
          view.pendingId = id;
          render();
          var nm = document.getElementById("nm");
          if (nm) { nm.scrollIntoView({ block: "center" }); nm.focus(); }
          return;
        }
        join(id);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("button.undo"), function (b) {
      b.addEventListener("click", function () { leave(b.getAttribute("data-id")); });
    });
  }

  function join(id) {
    var list = state.rsvp[id] || [], mine = myKids();
    mine.forEach(function (k) { if (list.indexOf(k) < 0) list.push(k); });
    state.rsvp[id] = list;
    render();
    if (!API) { toast('הסימון לא נשמר, חסרה הגדרת מסד הנתונים'); return; }
    Promise.all(mine.map(function (k) { return addMark(id, k); }))
      .then(loadMarks)
      .catch(function () { toast('השמירה נכשלה, אפשר לנסות שוב'); });
  }
  function leave(id) {
    var mine = myKids();
    state.rsvp[id] = (state.rsvp[id] || []).filter(function (k) { return mine.indexOf(k) < 0; });
    render();
    if (!API) return;
    Promise.all(mine.map(function (k) { return removeMark(id, k); }))
      .then(loadMarks)
      .catch(function () { toast('הביטול נכשל, אפשר לנסות שוב'); });
  }
  function after() {
    render();
    if (!canWrite) { toast("הסימון נשמר רק אצלך, אין הרשאת כתיבה לדף"); return; }
    save();
  }

  function loadMarks() {
    if (!API) return Promise.resolve();
    return fetch(API + '?select=event_id,kid', { headers: HEAD })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (rows) {
        var next = {};
        rows.forEach(function (row) {
          (next[row.event_id] = next[row.event_id] || []).push(row.kid);
        });
        state.rsvp = next;
        render();
      })
      .catch(function () {});
  }

  function addMark(id, kid) {
    return fetch(API, {
      method: 'POST',
      headers: Object.assign({ Prefer: 'resolution=ignore-duplicates' }, HEAD),
      body: JSON.stringify({ event_id: id, kid: kid })
    });
  }
  function removeMark(id, kid) {
    return fetch(API + '?event_id=eq.' + encodeURIComponent(id) + '&kid=eq.' + encodeURIComponent(kid), {
      method: 'DELETE',
      headers: HEAD
    });
  }

  var saving = false, pending = false;
  render();

  canWrite = true;
  loadMarks();
  window.addEventListener('focus', loadMarks);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) loadMarks();
  });
})();
</script>
</body>
</html>
